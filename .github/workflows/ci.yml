name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Engine tests (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # The tests do not need the Electron binary; --ignore-scripts skips the 235 MB download.
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check src/renderer/app.js
          node --check src/engine/ai.js
          node --check src/engine/cleaner.js
          node --check src/engine/scanner.js

      - name: Translation and interface audit
        # A missing key reaches the user as a raw `cat.foo.name`; an undefined id
        # leaves the interface half-rendered. Both are caught here.
        run: |
          node scripts/i18n-audit.js
          node scripts/ui-audit.js

      - name: Tests
        run: npm test
