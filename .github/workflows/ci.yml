name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Motor testleri (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node }} kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Bağımlılıkları kur
        # Testler Electron ikilisine ihtiyaç duymaz; --ignore-scripts 235 MB indirmeyi atlar.
        run: npm ci --ignore-scripts

      - name: Sözdizimi denetimi
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check src/renderer/app.js
          node --check src/engine/ai.js
          node --check src/engine/cleaner.js
          node --check src/engine/scanner.js

      - name: Çeviri ve arayüz denetimi
        # Eksik anahtar kullanıcıya ham `cat.foo.name` olarak görünür; tanımsız
        # bir id ise arayüzü yarıda bırakır. İkisi de burada yakalanır.
        run: |
          node scripts/i18n-audit.js
          node scripts/ui-audit.js

      - name: Testler
        run: npm test
