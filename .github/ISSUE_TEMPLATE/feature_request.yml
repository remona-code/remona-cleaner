name: Feature request
description: Suggest a new category, behaviour or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem first, not the proposal.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Does this proposal delete files?
      description: >
        If the change deletes files, remember that deletable roots can only be
        defined in `src/engine/config.js`.
      options:
        - No, interface or information only
        - Yes, a new scan category
        - Yes, it changes cleanup behaviour

  - type: checkboxes
    id: rules
    attributes:
      label: Confirmation
      options:
        - label: >
            I have checked that this proposal does not touch personal folders
            (Documents, Desktop, Pictures).
