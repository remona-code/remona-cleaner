name: Bug report
description: The application behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not use this form for security vulnerabilities.** Please follow the
        private reporting path in [SECURITY.md](../SECURITY.md).

        Do not paste API keys, personal file paths or quarantine contents into a
        report.

  - type: input
    id: version
    attributes:
      label: reMona version
      description: Shown on the Settings screen inside the application.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Scanning
        - Cleanup / quarantine
        - AI panel
        - Settings / OpenAI connection
        - Interface / appearance
        - The application does not open
        - Other

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the application
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste any error message verbatim.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output (optional)
      description: >
        Output of `npm start`. Remove personal information and keys.
      render: shell
